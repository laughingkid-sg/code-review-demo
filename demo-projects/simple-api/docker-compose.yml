version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/catalog.db
      - API_KEY=dev-api-key-12345
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
