name: Code Rules Review

on:
  pull_request:
    branches:
      - main
    paths:
      - "demo-projects/**/*.go"
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  code-rules-review:
    name: Code rules review
    if: >-
      github.event.pull_request.user.login == 'laughingkid-sg' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout knowledgebase
        uses: actions/checkout@v4
        with:
          repository: laughingkid-sg/code-review-knowledgebase
          ref: main
          path: code-review-knowledgebase
          token: ${{ secrets.KNOWLEDGEBASE_REPO_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect changed files
        id: changed-files
        shell: bash
        run: |
          {
            echo "files<<EOF"
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run code rules review
        uses: laughingkid-sg/code-review-agent@codex/app-skills-support
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL || 'https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL }}
        with:
          mode: code-rules
          config-path: .code-review.yml
          repository-path: .
          knowledgebase-path: code-review-knowledgebase
          output-path: .code-review/artifacts/code-rules-review.md
          provider: llm
          comment-mode: pr_comment
          audit-dir: output
          changed-files: ${{ steps.changed-files.outputs.files }}
          skills: |
            code-review-findings
            github-inline-comments

      - name: Upload code rules artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-rules-review
          path: |
            .code-review/artifacts/code-rules-review.md
            output/code-rules-review.md
          if-no-files-found: error
